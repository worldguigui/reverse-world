<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界图志 · 世界观时间轴工具</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  <style>
    :root {
      --ink: #dfe7ff;
      --ink-dim: #8fa3c8;
      --glass: rgba(13, 20, 38, 0.78);
      --line: rgba(140, 170, 255, 0.18);
      --accent: #6ea8ff;
      --danger: #ff7a7a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: var(--ink); }
    body.mode-draw canvas { cursor: crosshair !important; }
    canvas { display: block; }

    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* ---------------- 顶栏 ---------------- */
    #topbar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 20;
      height: 44px;
    }
    .topbar-inner {
      display: flex; align-items: center; gap: 10px; height: 100%;
      padding: 0 10px;
    }
    .bar-side { display: flex; align-items: center; gap: 8px; flex: 1; }
    .bar-side:last-child { justify-content: flex-end; }
    .bar-center { display: flex; gap: 4px; }
    .brand {
      background: none; border: none; color: var(--ink);
      font-size: 15px; font-weight: 600; letter-spacing: 1px;
      cursor: pointer; padding: 6px 8px; border-radius: 6px;
      max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .brand:hover { background: rgba(110, 168, 255, 0.12); }
    .icon-btn {
      background: none; border: none; color: var(--ink-dim); font-size: 16px;
      cursor: pointer; padding: 6px 9px; border-radius: 6px;
    }
    .icon-btn:hover { color: var(--ink); background: rgba(110, 168, 255, 0.12); }
    .mode-btn {
      background: none; border: 1px solid transparent; color: var(--ink-dim);
      font-size: 12.5px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    }
    .mode-btn:hover { color: var(--ink); background: rgba(110, 168, 255, 0.1); }
    .mode-btn.active {
      color: var(--ink); background: rgba(110, 168, 255, 0.2);
      border-color: rgba(110, 168, 255, 0.45);
    }
    .mode-hint { font-size: 12px; color: var(--ink-dim); margin-right: 6px; }

    /* 项目下拉菜单 */
    .menu {
      position: absolute; top: 46px; left: 10px; z-index: 30;
      min-width: 220px; padding: 6px; display: grid; gap: 2px;
    }
    .menu-item {
      background: none; border: none; color: var(--ink); text-align: left;
      font-size: 13px; padding: 9px 12px; border-radius: 6px; cursor: pointer;
    }
    .menu-item:hover { background: rgba(110, 168, 255, 0.15); }
    .menu-sep { height: 1px; margin: 4px 6px; background: var(--line); }

    /* ---------------- 右侧检查器 ---------------- */
    #inspector {
      position: fixed; top: 68px; right: 12px; z-index: 15;
      width: 300px; max-height: calc(100vh - 160px);
      overflow-y: auto; padding: 14px;
    }
    #inspector:empty { display: none; }
    .insp-block { display: grid; gap: 10px; }
    .insp-title { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
    .insp-hint { font-size: 12px; color: var(--ink-dim); line-height: 1.6; margin: 0; }
    .field-label { font-size: 11px; color: var(--ink-dim); letter-spacing: 1px; }
    .inp {
      width: 100%; background: rgba(110, 168, 255, 0.1); color: var(--ink);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 7px 9px; font-size: 13px; font-family: inherit; outline: none;
    }
    .inp:focus { border-color: var(--accent); }
    textarea.inp { resize: vertical; }
    select.inp option { background: #101a33; }
    .btn {
      background: rgba(110, 168, 255, 0.12); border: 1px solid var(--line);
      color: var(--ink); font-size: 12.5px; padding: 8px 12px;
      border-radius: 7px; cursor: pointer;
    }
    .btn:hover { background: rgba(110, 168, 255, 0.22); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: rgba(110, 168, 255, 0.3); border-color: rgba(110, 168, 255, 0.5); }
    .btn-danger { color: var(--danger); border-color: rgba(255, 122, 122, 0.35); }
    .btn-danger:hover { background: rgba(255, 122, 122, 0.15); }
    .btn-ghost { background: none; border: none; color: var(--ink-dim); }
    .btn-ghost:hover { color: var(--ink); background: rgba(110, 168, 255, 0.1); }
    .btn-mini { padding: 3px 8px; font-size: 11px; }
    .sep { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
    .stat-grid { display: flex; gap: 8px; margin-top: 4px; }
    .stat {
      flex: 1; text-align: center; padding: 8px 4px;
      background: rgba(110, 168, 255, 0.08); border-radius: 8px;
    }
    .stat b { display: block; font-size: 16px; }
    .stat span { font-size: 10px; color: var(--ink-dim); }
    .entry-img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
    .map-thumb { width: 64px; height: 32px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
    .map-row {
      display: flex; align-items: center; gap: 8px; font-size: 12.5px;
      padding: 5px 6px; border-radius: 6px; cursor: pointer;
    }
    .map-row:hover { background: rgba(110, 168, 255, 0.08); }

    /* ---------------- 底部时间轴 ---------------- */
    #timeline {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 20;
      max-width: min(86vw, 900px);
    }
    .tl-inner {
      display: flex; align-items: center; gap: 6px; padding: 7px 10px;
    }
    .tl-chips { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
    .tl-chips::-webkit-scrollbar { display: none; }
    .tl-chip {
      flex-shrink: 0; background: rgba(110, 168, 255, 0.08); border: 1px solid var(--line);
      color: var(--ink-dim); font-size: 12.5px; padding: 7px 14px;
      border-radius: 999px; cursor: pointer; white-space: nowrap;
    }
    .tl-chip:hover { color: var(--ink); background: rgba(110, 168, 255, 0.16); }
    .tl-chip.current {
      color: #04122e; background: var(--accent); border-color: var(--accent); font-weight: 600;
    }
    .tl-arrow {
      flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
      background: rgba(110, 168, 255, 0.1); border: 1px solid var(--line);
      color: var(--ink); cursor: pointer; font-size: 12px;
    }
    .tl-arrow:hover { background: rgba(110, 168, 255, 0.22); }
    .tl-add { color: var(--accent); font-size: 15px; }

    /* ---------------- 画面设置 ---------------- */
    #settings {
      position: fixed; top: 68px; right: 12px; z-index: 25;
      width: 300px; max-height: calc(100vh - 160px);
      overflow-y: auto; padding: 14px;
    }
    #settings:empty { display: none; } /* 关掉后组件渲染空，只留容器 */
    .set-group { display: grid; gap: 9px; }
    .set-group + .set-group { padding-top: 9px; border-top: 1px solid var(--line); }
    .set-head { font-size: 11px; color: var(--ink-dim); letter-spacing: 1px; }
    .set-row { display: grid; gap: 3px; font-size: 12.5px; }
    .set-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .set-val { font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
    .set-row input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .set-row input[type="color"] {
      width: 100%; height: 26px; padding: 0; cursor: pointer;
      background: none; border: 1px solid var(--line); border-radius: 6px;
    }
    .set-check { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
    .set-check input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }

    /* ---------------- 浮层 ---------------- */
    #tooltip {
      position: fixed; z-index: 40; padding: 4px 10px; font-size: 12px;
      pointer-events: none; white-space: nowrap; color: var(--ink);
    }
    #tooltip[hidden] { display: none; }

    #error {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.85);
    }
    #error[hidden] { display: none; }
    #error .box { max-width: 460px; padding: 26px 30px; border-color: rgba(255, 120, 120, 0.4); }
    #error h2 { margin: 0 0 10px; font-size: 16px; color: #ff9a9a; }
    #error p { margin: 6px 0; font-size: 13px; color: var(--ink-dim); line-height: 1.7; word-break: break-all; }

    /* ---------------- 底图工坊 ---------------- */
    .workshop {
      position: fixed; inset: 0; z-index: 80;
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px; background: rgba(4, 8, 18, 0.96);
    }
    .workshop.hidden { display: none; }
    .wk-top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
    .wk-title { font-weight: 600; letter-spacing: 1px; margin-right: 6px; }
    .wk-dim { font-size: 12px; color: var(--ink-dim); }
    .wk-body { display: flex; gap: 10px; flex: 1; min-height: 0; }
    .wk-side {
      width: 200px; flex-shrink: 0; padding: 12px;
      display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
    }
    .wk-tool {
      background: rgba(110, 168, 255, 0.08); border: 1px solid var(--line);
      color: var(--ink-dim); text-align: left; font-size: 13px;
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
    }
    .wk-tool:hover { color: var(--ink); background: rgba(110, 168, 255, 0.16); }
    .wk-tool.active {
      color: var(--ink); background: rgba(110, 168, 255, 0.24);
      border-color: rgba(110, 168, 255, 0.5);
    }
    .wk-slider { display: grid; gap: 4px; font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
    .wk-slider input { width: 100%; accent-color: var(--accent); }
    .wk-canvas-wrap {
      flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); border-radius: 10px; padding: 10px;
      background: rgba(4, 8, 18, 0.6);
    }
  </style>
</head>
<body>
  <div id="topbar" class="glass"></div>
  <div id="inspector" class="glass"></div>
  <div id="timeline" class="glass"></div>
  <div id="settings" class="glass"></div>
  <div id="tooltip" class="glass" hidden></div>
  <div id="workshop" class="workshop hidden"></div>

  <div id="error" hidden>
    <div class="box glass">
      <h2>启动失败</h2>
      <p id="error-msg"></p>
      <p>请确认浏览器支持 WebGL 后刷新重试。</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
